<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Registration Page</title>
  </head>
  <body>
    <!-- this is a navbar -->
    <header>
      <nav class="nav-col">
        <a class="logo-pic">Tic Tac Toe</a>
        <ul class="Page-links">
          <li><a href="index.html">Home</a></li>
          <li>
            <a href="signup.html">Sign-up</a>
          </li>
          <li><a href="Login.html">Log-In</a></li>
          <li><a href="Game.html">Play Game</a></li>
          <li>
            <a href="leardborad.html">LeaderBoard</a>
          </li>
        </ul>
      </nav>
    </header>
    <!-- this is login form -->
    <div class="row center">
      <div class="container1 col">
        <form onsubmit="check()">
          <label class="inputitems">Log-In Form</label>
          <div class="inputitems">
            <input type="text" placeholder="Enter your Name" id="name" />
          </div>
          <div class="inputitems">
            <input type="password" placeholder="Password" id="pw" />
          </div>
          <div class="policy">
            <input type="checkbox" />
            <h3>I accept all terms & condition</h3>
          </div>
          <div class="inputitems">
            <button class="btn">submit</button>
          </div>
        </form>
      </div>
    </div>
    <!-- Addinig external javascript file -->
    <script src="javascript/GameJs.js"></script>
  </body>
</html>
