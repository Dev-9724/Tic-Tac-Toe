<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>LeaderBoard Page</title>
  </head>
  <body>
    <!-- this is a navbar -->
    <header>
      <nav class="nav-col">
        <a class="logo-pic">Tic Tac Toe</a>
        <ul class="Page-links">
          <li><a href="index.html">Home</a></li>
          <li>
            <a href="signup.html">Sign-up</a>
          </li>
          <li><a href="Login.html">Log-In</a></li>
          <li><a href="Game.html">Play Game</a></li>
          <li>
            <a href="leardborad.html">LeaderBoard</a>
          </li>
        </ul>
      </nav>
    </header>
    <!-- from here table is starting -->
    <div class="center">
      <div class="table-work">
        <table class="table table-dark table-center">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">First</th>
              <th scope="col">Last</th>
              <th scope="col">Handle</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td>Mark</td>
              <td>Otto</td>
              <td>@mdo</td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Jacob</td>
              <td>Thornton</td>
              <td>@fat</td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td colspan="2">Larry the Bird</td>
              <td>@twitter</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- Addinig external javascript file -->
    <script src="javascript/GameJs.js"></script>
  </body>
