<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Game Details</title>
  </head>

  <body>
    <!-- this is a navbar -->
    <header>
      <nav class="nav-col">
        <a class="logo-pic">Tic Tac Toe</a>
        <ul class="Page-links">
          <li><a href="index.html">Home</a></li>
          <li>
            <a href="signup.html">Sign-up</a>
          </li>
          <li><a href="Login.html">Log-In</a></li>
          <li><a href="Game.html">Play Game</a></li>
          <li>
            <a href="leardborad.html">LeaderBoard</a>
          </li>
        </ul>
      </nav>
    </header>
    <div class="center">
      <!-- select box -->

      <div class="select-box">
        <div class="content">
          <div class="title">Choose Your Side</div>
          <div class="options">
            <button class="playerX">Play as X</button>
            <button class="playerO">Play as O</button>
          </div>
        </div>
      </div>

      <!-- playboard section -->
      <div class="play-board">
        <div class="details">
          <div class="players">
            <span class="Xturn">X's Turn</span>
            <span class="Oturn">O's Turn</span>
            <div class="slider"></div>
          </div>
        </div>
        <div class="play-area">
          <section>
            <span class="box box1"></span>
            <span class="box box2"></span>
            <span class="box box3"></span>
          </section>
          <section>
            <span class="box box4"></span>
            <span class="box box5"></span>
            <span class="box box6"></span>
          </section>
          <section>
            <span class="box box7"></span>
            <span class="box box8"></span>
            <span class="box box9"></span>
          </section>
        </div>
      </div>

      <!-- result box -->
      <div class="result-box">
        <div class="won-text"></div>
        <div class="btn"><button>Replay</button></div>
      </div>
    </div>
    <!-- Addinig external javascript file -->
    <script src="javascript/GameJs.js"></script>
  </body>
</html>
